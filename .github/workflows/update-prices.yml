name: Update card prices

on:
  schedule:
    - cron: "17 9 * * *"      # 2:17am Pacific, daily
  push:
    paths:
      - "cards.csv"           # rerun whenever you upload a new export
  workflow_dispatch:          # or press the button yourself

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices from Scryfall
        run: python update_prices.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add cards.json
          git diff --staged --quiet || git commit -m "Update prices"
          git push
